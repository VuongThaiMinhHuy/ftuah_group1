const shown=Math.max(0,Math.min(step,5));
return html`<div class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6"><div class="glass bg-white/90 rounded-3xl w-full max-w-3xl p-8 relative">
<button onClick=${onClose} class="absolute top-5 right-5 p-2 rounded-full hover:bg-gray-100"><${Ic} n="x"/></button>

${step<0&&html`<div class="h-full flex flex-col items-center justify-center text-gray-400"><${Ic} n="mic" s=${40}/><p class="mt-2">${L.trIdle}</p></div>`}
${LINES.slice(0,shown).map((l,i)=>html`<div key=${i} class="grid grid-cols-2 gap-4"><p class="text-gray-500 text-sm bg-gray-50 rounded-xl p-3">🇻🇳 ${l[0]}</p><p class="text-[#C8102E] font-semibold text-sm bg-red-50 rounded-xl p-3">🇬🇧 ${l[1]}</p></div>`)}</div>

${run?html`<div class="flex items-end gap-1 h-8">${[0,1,2,3,4,5,6,7].map(i=>html`<div key=${i} class="bar" style=${{animationDelay:i*0.11+"s"}}></div>`)}</div><div class="flex-1 h-2 rounded-full bg-red-100 overflow-hidden"><div class="h-full bg-[#C8102E] transition-all duration-1000" style=${{width:(shown/5*100)+"%"}}></div></div><span class="text-sm font-semibold text-[#C8102E]">${L.listening} ${shown}/5s</span>`

function Chat(){const L=useL();const [open,setOpen]=useState(false);const [busy,setBusy]=useState(false);const [q,setQ]=useState("");
const [m,setM]=useState([{r:"ai",key:"greet"}]);const end=useRef();
useEffect(()=>{end.current&&end.current.scrollIntoView({behavior:"smooth"})},[m,busy,open]);
const send=(text,shown)=>{text=(text||q).trim();if(!text||busy)return;setQ("");setM(x=>[...x,{r:"u",t:shown||text}]);setBusy(true);
setTimeout(()=>{const l=text.toLowerCase();const hit=mockDB.find(d=>d.intents.some(k=>l.includes(k)));
setM(x=>[...x,hit?{r:"ai",t:hit.response}:{r:"ai",key:"fb"}]);setBusy(false)},1500)};
if(!open)return html`<button onClick=${()=>setOpen(true)} class="fixed bottom-6 right-6 z-30 bg-[#C8102E] text-white rounded-full pl-5 pr-6 py-4 shadow-2xl flex items-center gap-3 font-bold hover:scale-105 transition"><${Ic} n="msg"/>FTU Support AI</button>`;
return html`<div class="fixed bottom-6 right-6 z-30 w-[380px] max-w-[calc(100vw-2rem)] h-[540px] max-h-[82vh] glass bg-white/90 rounded-3xl flex flex-col overflow-hidden shadow-2xl">
<div class="bg-gradient-to-r from-[#C8102E] to-[#a60d26] text-white px-5 py-4 flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center"><${Ic} n="spark" s=${18}/></div><div class="flex-1"><p class="font-bold leading-tight">FTU Support AI</p><p class="text-xs text-white/80">● ${L.online}</p></div><button onClick=${()=>setOpen(false)}><${Ic} n="x" s=${20}/></button></div>
<div class="flex-1 overflow-auto sc p-4 space-y-3 bg-gradient-to-b from-red-50/50 to-transparent">${m.map((x,i)=>html`<div key=${i} class=${"flex "+(x.r==="u"?"justify-end":"")}><${Bub} x=${x}/></div>`)}
${busy&&html`<div class="inline-flex items-center gap-2 bg-white border border-red-100 rounded-2xl rounded-bl-sm px-4 py-2.5 shadow-sm"><span class="w-4 h-4 rounded-full border-2 border-[#C8102E] border-t-transparent animate-spin"></span><span class="text-sm text-gray-500 italic">${L.search}</span></div>`}<div ref=${end}></div></div>
<div class="px-4 pb-2 flex gap-1.5 flex-wrap">${CHIPS.map(([e,k,qq])=>html`<button key=${k} disabled=${busy} onClick=${()=>send(qq,e+" "+L[k])} class="text-xs px-3 py-1 rounded-full border border-[#C8102E]/30 text-[#C8102E] bg-white hover:bg-red-50 disabled:opacity-50">${e} ${L[k]}</button>`)}</div>
<div class="p-3 border-t border-red-100 flex gap-2"><input value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&send()} placeholder=${L.ph} class="flex-1 rounded-xl border border-gray-200 px-4 py-2.5 text-sm outline-none focus:border-[#C8102E] bg-white"/><button onClick=${()=>send()} class="bg-[#C8102E] text-white rounded-xl px-4"><${Ic} n="send" s=${18}/></button></div></div>`}

<div class="grid md:grid-cols-2 gap-4"><${Info} ic="clock" l=${L.tl} v=${L[p.time]}/><${Info} ic="user" l=${L.co} v=${L[p.who]}/></div>
<div class="glass rounded-2xl p-5"><p class="flex items-center gap-2 text-xs font-bold uppercase tracking-wide text-[#C8102E]"><${Ic} n="spark" s=${16}/>${L.ac}</p><p class="mt-2 text-lg leading-relaxed">${L[p.act]}</p></div>
<div class="glass rounded-2xl p-5"><p class="text-xs font-bold uppercase tracking-wide text-[#C8102E] mb-3">${L.ck}</p><div class="grid sm:grid-cols-2 gap-2">${p.docs.map((d,i)=>html`<button key=${i} onClick=${()=>setOk(o=>({...o,[i]:!o[i]}))} class=${"flex items-center gap-3 text-left rounded-xl px-4 py-3 border transition "+(ok[i]?"bg-red-50 border-[#C8102E]/40":"bg-white border-gray-200")}><span class=${"w-6 h-6 rounded-full flex items-center justify-center shrink-0 "+(ok[i]?"bg-[#C8102E] text-white":"border-2 border-gray-300")}>${ok[i]&&html`<${Ic} n="check" s=${14} w=${3}/>`}</span><span class="font-medium">${L[d]}</span></button>`)}</div></div>
<button onClick=${onQr} class="w-full bg-[#C8102E] hover:bg-[#a60d26] text-white font-bold text-lg py-5 rounded-2xl flex items-center justify-center gap-3 shadow-xl"><${Ic} n="mobile" s=${24}/>${L.send}</button></div>`}

function QR({seed}){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const r=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};const N=25,cells=[];
const fin=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!fin(x,y)&&r()>.52)cells.push(html`<rect key=${x+"-"+y} x=${x} y=${y} width="1" height="1"/>`)}
const F=(x,y)=>html`<g key=${x+"f"+y}><rect x=${x} y=${y} width="7" height="7"/><rect x=${x+1} y=${y+1} width="5" height="5" fill="#fff"/><rect x=${x+2} y=${y+2} width="3" height="3"/></g>`;
return html`<svg viewBox="-1 -1 27 27" class="w-56 h-56 bg-white rounded-xl" fill="#111">${cells}${F(0,0)}${F(N-7,0)}${F(0,N-7)}</svg>`}

function QRModal({p,onClose}){const L=useL();return html`<div class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6"><div class="glass bg-white/95 rounded-3xl p-8 w-full max-w-md text-center relative">
<button onClick=${onClose} class="absolute top-5 right-5 p-2 rounded-full hover:bg-gray-100"><${Ic} n="x"/></button>
<div class="w-12 h-12 mx-auto rounded-2xl bg-[#C8102E] text-white flex items-center justify-center mb-3"><${Ic} n="mobile"/></div>
<h2 class="text-2xl font-extrabold">${L.qrT}</h2><p class="text-sm text-gray-500 mt-1">${L.qrD} <b class="text-[#C8102E]">${L[p.t]}</b></p>
<div class="my-5 inline-block p-3 rounded-2xl border-2 border-[#C8102E]/30 bg-white"><${QR} seed=${p.id}/></div>
<p class="text-xs text-gray-400">${L.qrN}</p>
<button onClick=${onClose} class="mt-4 bg-[#C8102E] text-white font-bold px-8 py-3 rounded-2xl">${L.done}</button></div></div>`}

function App(){const [lang,setLang]=useState("en");const [view,setView]=useState("dash");const [tr,setTr]=useState(false);const [proc,setProc]=useState(null);const [qr,setQr]=useState(false);
const L=translations[lang];
const nav=[["dash","home"],["lang","lang"],["cult","heart"],["admin","brief"]];
const cards=view==="dash"?CARDS:CARDS.filter(c=>c.cat===view);
return html`<${LC.Provider} value=${lang}><div class="bg h-full flex flex-col">
<header class="glass m-3 mb-0 rounded-3xl px-5 py-3 flex items-center gap-4 flex-wrap">
<div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-[#C8102E] text-white font-black flex items-center justify-center tracking-tight">FTU</div><div class="leading-tight"><p class="font-extrabold text-[#C8102E]">FTU Assistant Hub</p><p class="text-xs text-gray-500">${L.sub1}</p></div></div>
<div class="flex-1 flex justify-center"><${Weather}/></div>
<${Clock}/>
<div class="flex rounded-xl bg-white/80 p-1 border border-red-100">${[["en","EN"],["vn","VN"],["kr","KR"],["fr","FR"],["zh","ZH"]].map(([k,l])=>html`<button key=${k} onClick=${()=>setLang(k)} class=${"px-2.5 py-1.5 rounded-lg text-sm font-bold "+(lang===k?"bg-[#C8102E] text-white":"text-gray-600")}>${l}</button>`)}</div></header>
<div class="flex-1 flex gap-3 p-3 min-h-0">
<aside class="glass rounded-3xl p-3 w-16 md:w-64 flex flex-col gap-2 shrink-0">
${nav.map(([k,i])=>html`<button key=${k} onClick=${()=>{setView(k);setProc(null)}} class=${"flex items-center gap-3 px-4 py-3.5 rounded-2xl font-semibold text-left transition "+(view===k?"bg-[#C8102E] text-white shadow-lg":"text-gray-700 hover:bg-red-50")}><${Ic} n=${i}/><span class="hidden md:inline">${L[k]}</span></button>`)}
<div class="flex-1"></div>
<button onClick=${()=>setView("sos")} class="flex items-center gap-3 px-4 py-3.5 rounded-2xl font-bold text-[#C8102E] bg-red-50 border-2 border-[#C8102E]/40 hover:bg-[#C8102E] hover:text-white transition"><${Ic} n="alert"/><span class="hidden md:inline">${L.sos}</span></button></aside>
<main class="flex-1 min-w-0 overflow-auto sc pr-1 space-y-4 pb-24">
<${Marquee}/>
${proc&&html`<${ProcDetail} key=${proc.id} p=${proc} onBack=${()=>setProc(null)} onQr=${()=>setQr(true)}/>`}
<div class=${"flex items-end justify-between "+(proc?"hidden":"")}><div><h1 class="text-3xl font-extrabold">${L.hi} <span class="text-[#C8102E]">🇻🇳</span></h1><p class="text-gray-600">${L.hs}</p></div><span class="hidden lg:block text-sm font-semibold text-[#C8102E] bg-red-50 px-4 py-2 rounded-full">${L[view==="sos"?"dash":view]}</span></div>
${!proc&&(view==="dash"||view==="admin")&&html`<section class="space-y-3"><div class="flex items-end justify-between"><div><h2 class="text-2xl font-extrabold">${L.procT}</h2><p class="text-sm text-gray-600">Thủ tục hành chính · ${L.procS}</p></div><span class="hidden md:block text-xs font-bold text-white bg-[#C8102E] px-3 py-1.5 rounded-full">${L.start}</span></div><div class="grid gap-4 grid-cols-1 sm:grid-cols-2 xl:grid-cols-4">${PROCS.map((p,i)=>html`<${ProcCard} key=${p.id} p=${p} i=${i} onClick=${()=>setProc(p)}/>`)}</div></section>`}
${!proc&&html`<h2 class="text-2xl font-extrabold pt-1">${L.tools}</h2>`}
<div class=${"grid gap-4 grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 "+(proc?"hidden":"")}>${cards.map(c=>html`<${CardUI} key=${c.id} c=${c} onClick=${()=>c.id===1&&setTr(true)}/>`)}</div>
</main></div>
${tr&&html`<${Translator} onClose=${()=>setTr(false)}/>`}
${qr&&proc&&html`<${QRModal} p=${proc} onClose=${()=>setQr(false)}/>`}
${view==="sos"&&html`<${SOS} onBack=${()=>setView("dash")}/>`}
<${Chat}/></div><//>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
